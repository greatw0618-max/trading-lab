name: Update data

on:
  schedule:
    # US market hours (13:30-20:00 UTC), every 30 minutes on weekdays
    - cron: '*/30 13-21 * * 1-5'
    # once a day for the leaderboard and daily bars
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download data
        shell: pwsh
        run: ./scripts/update-data.ps1

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
